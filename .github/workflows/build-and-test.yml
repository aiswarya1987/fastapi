name: FASTAPI CI/CD

on:
  push:
    branches-ignore:
      - main
      - npe
  pull_request:
    branches: 
      - main

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  K8S_NAMESPACE: staging
  PYTHON_VERSION: "3.11"
  APP_PORT: 8080
  IMAGE_NAME: ${{ github.repository_owner }}/fastapi
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Test Suite
        run: pytest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        id: docker_build
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Set image variable
        run: echo "IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Start Minikube
        run: minikube start --driver=docker

      - name: Configure kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Set Docker config for GHCR
        run: |
          echo "DOCKER_CONFIG_JSON=$(cat ~/.docker/config.json | base64 -w 0)" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          # Replace variables in deployment template
          envsubst < k8s/deployment.yaml.template > k8s/deployment.yaml
          
          # Apply the deployment
          kubectl apply -f k8s/deployment.yaml
          
          # Wait for rollout to complete
         # kubectl rollout status deployment/fastapi-deployment -n ${{ env.K8S_NAMESPACE }}
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          APP_PORT: ${{ env.APP_PORT }}
          DOCKER_CONFIG_JSON: ${{ env.DOCKER_CONFIG_JSON }}
